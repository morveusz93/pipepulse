services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pipepulse
      POSTGRES_PASSWORD: pipepulse
      POSTGRES_DB: pipepulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipepulse"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: ./api
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      PIPEPULSE_DATABASE_URL: postgresql+psycopg://pipepulse:pipepulse@postgres:5432/pipepulse
    depends_on:
      postgres:
        condition: service_healthy

  # Demo mode only: regenerate demo history relative to now on every start.
  seed:
    build: ./api
    command: ["python", "-m", "pipepulse.seed", "--if-demo-mode"]
    env_file: .env
    environment:
      PIPEPULSE_DATABASE_URL: postgresql+psycopg://pipepulse:pipepulse@postgres:5432/pipepulse
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ./api
    env_file: .env
    environment:
      PIPEPULSE_DATABASE_URL: postgresql+psycopg://pipepulse:pipepulse@postgres:5432/pipepulse
    ports:
      - "8000:8000"
    healthcheck:
      # The slim image has no curl; the venv's Python is enough.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        PIPEPULSE_API_URL: http://api:8000
    environment:
      PIPEPULSE_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build: ./api
    command: ["python", "-m", "pipepulse.worker"]
    env_file: .env
    environment:
      PIPEPULSE_DATABASE_URL: postgresql+psycopg://pipepulse:pipepulse@postgres:5432/pipepulse
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
