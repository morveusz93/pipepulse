# Images are pushed by CI as <repository>/api:<tag> and <repository>/web:<tag>.
image:
  repository: registry.gitlab.com/morveusz93/pipepulse
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Internal: serve generated demo data with a nightly reseed instead of tracking GitLab.
demo:
  enabled: false
  reseedSchedule: "0 3 * * *"
  historyDays: 60

config:
  pollIntervalSeconds: 120
  backfillDays: 30
  traceTailLines: 50

# GitLab instance and projects to track. Empty `projects` = every project the token can see
# pipelines of. Dropped projects stop being polled; their history stays until deleted on the
# dashboard.
gitlab:
  url: https://gitlab.com
  projects: []
  #  - group/api
  #  - group/web

# The GitLab token (read_api scope). Prefer `existingSecret` with key `gitlab-token`, created
# out of band (`kubectl create secret generic ...`); never commit a real token here.
secrets:
  existingSecret: ""
  gitlabToken: ""

# /metrics on the API service (not routed by the Ingress). Annotations let Prometheus setups
# that discover pods by annotation scrape it without further config.
metrics:
  scrapeAnnotations: true

api:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

web:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

worker:
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { memory: 256Mi }

postgres:
  # Disable to use an external database via `externalDatabaseUrl` (key in existingSecret).
  enabled: true
  image: postgres:17-alpine
  storage: 2Gi
  storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

ingress:
  enabled: true
  className: traefik
  host: pipepulse.morv.dev
  tls:
    enabled: true
    # cert-manager ClusterIssuer; leave empty if TLS is terminated elsewhere.
    clusterIssuer: letsencrypt
