# Images are published by the release workflow as <repository>/api:<tag> and
# <repository>/web:<tag>. An empty tag means the chart's appVersion.
image:
  repository: ghcr.io/morveusz93/pipepulse
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Serve generated demo data (6 projects, nightly reseed) instead of tracking GitLab.
# Handy for a first look: no token needed.
demo:
  enabled: false
  reseedSchedule: "0 3 * * *"
  historyDays: 60

config:
  pollIntervalSeconds: 120
  backfillDays: 30
  traceTailLines: 50

# GitLab instance and projects to track. Empty `projects` = every project the token can see
# pipelines of. Dropped projects stop being polled; their history stays until deleted on the
# dashboard.
gitlab:
  url: https://gitlab.com
  projects: []
  #  - group/api
  #  - group/web

# The GitLab token (read_api scope). Prefer `existingSecret` with key `gitlab-token`, created
# out of band (`kubectl create secret generic ...`); never commit a real token here.
secrets:
  existingSecret: ""
  gitlabToken: ""

# /metrics on the API service (not routed by the Ingress). Annotations let Prometheus setups
# that discover pods by annotation scrape it without further config.
metrics:
  scrapeAnnotations: true

api:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

web:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

worker:
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { memory: 256Mi }

postgres:
  # Disable to use an external database via `externalDatabaseUrl` (key in existingSecret).
  enabled: true
  image: postgres:17-alpine
  storage: 2Gi
  storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

ingress:
  enabled: true
  # Empty = the cluster's default IngressClass (traefik on k3s).
  className: ""
  host: pipepulse.localhost
  tls:
    enabled: false
    # cert-manager ClusterIssuer, e.g. "letsencrypt" (see deploy/cluster/cluster-issuer.yaml).
    clusterIssuer: ""
