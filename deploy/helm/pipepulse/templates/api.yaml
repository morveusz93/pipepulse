{{- $fullname := include "pipepulse.fullname" . }}
{{- $component := dict "root" . "component" "api" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "pipepulse.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- include "pipepulse.selector" $component | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "pipepulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "pipepulse.selector" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pipepulse.selector" $component | nindent 8 }}
      {{- if .Values.metrics.scrapeAnnotations }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "pipepulse.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "pipepulse.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "pipepulse.backendEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            {{- include "pipepulse.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
