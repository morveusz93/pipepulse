{{- $fullname := include "pipepulse.fullname" . }}
{{- if .Values.postgres.enabled }}
{{- /* Generate the DB password once, then keep reusing it across upgrades. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres" $fullname) }}
{{- $password := "" }}
{{- if and $existing $existing.data }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "pipepulse.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-app
  labels:
    {{- include "pipepulse.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.secrets.encryptionKey }}
  encryption-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.adminPassword }}
  admin-password: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
