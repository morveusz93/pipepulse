name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pipepulse
          POSTGRES_PASSWORD: pipepulse
          POSTGRES_DB: pipepulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pipepulse" --health-interval 2s --health-retries 15
    env:
      PIPEPULSE_DATABASE_URL: postgresql+psycopg://pipepulse:pipepulse@localhost:5432/pipepulse
      PIPEPULSE_TEST_DATABASE_URL: postgresql+psycopg://pipepulse:pipepulse@localhost:5432/pipepulse
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # no floating major tags for this action
        with:
          version: "0.6.17"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Migrations must apply cleanly and match the models before tests reset the schema.
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build the frontend-only demo
        run: npm run build
        env:
          PIPEPULSE_DEMO: "true"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/pipepulse
      - run: helm template pipepulse deploy/helm/pipepulse > /dev/null
      - run: >-
          helm template pipepulse deploy/helm/pipepulse
          --set demo.enabled=true > /dev/null
      - run: >-
          helm template pipepulse deploy/helm/pipepulse
          --set postgres.enabled=false,secrets.existingSecret=app > /dev/null

  # Installs the chart on a throwaway kind cluster in demo mode (no GitLab token) and checks
  # that the API serves seeded data and the dashboard renders it.
  helm-install:
    needs: helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker build -t local/pipepulse/api:ci api
          docker build -t local/pipepulse/web:ci web
      - uses: helm/kind-action@v1
        with:
          cluster_name: pipepulse
      - name: Load images into kind
        run: kind load docker-image local/pipepulse/api:ci local/pipepulse/web:ci --name pipepulse
      - uses: azure/setup-helm@v5
      - name: Install
        run: >-
          helm install pp deploy/helm/pipepulse -n pipepulse --create-namespace
          --set image.repository=local/pipepulse,image.tag=ci,image.pullPolicy=Never
          --set demo.enabled=true,ingress.enabled=false
          --wait --timeout 6m
      - name: Smoke test
        run: |
          kubectl -n pipepulse port-forward svc/pp-pipepulse-api 8000:8000 &
          kubectl -n pipepulse port-forward svc/pp-pipepulse-web 3000:3000 &
          sleep 5
          curl -sf localhost:8000/readyz
          projects=$(curl -sf localhost:8000/api/projects | jq length)
          echo "projects: $projects"
          test "$projects" -gt 0
          curl -sf -o /dev/null localhost:3000/
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n pipepulse get pods,jobs -o wide
          kubectl -n pipepulse describe pods | tail -n 80
          kubectl -n pipepulse logs -l app.kubernetes.io/instance=pp --all-containers --tail=50
