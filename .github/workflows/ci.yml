name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pipepulse
          POSTGRES_PASSWORD: pipepulse
          POSTGRES_DB: pipepulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pipepulse" --health-interval 2s --health-retries 15
    env:
      PIPEPULSE_DATABASE_URL: postgresql+psycopg://pipepulse:pipepulse@localhost:5432/pipepulse
      PIPEPULSE_TEST_DATABASE_URL: postgresql+psycopg://pipepulse:pipepulse@localhost:5432/pipepulse
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.6.17"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Migrations must apply cleanly and match the models before tests reset the schema.
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build the frontend-only demo
        run: npm run build
        env:
          PIPEPULSE_DEMO: "true"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/pipepulse
      - run: helm template pipepulse deploy/helm/pipepulse > /dev/null
      - run: >-
          helm template pipepulse deploy/helm/pipepulse
          --set demo.enabled=false,postgres.enabled=false,secrets.existingSecret=app > /dev/null
